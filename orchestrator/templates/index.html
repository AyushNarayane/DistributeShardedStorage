<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orchestrator Node</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border-color: #334155;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 2rem 1rem;
        }
        .container {
            background-color: var(--container-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 550px;
            text-align: center;
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            color: var(--text-color);
        }
        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .badges {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.6rem;
            border-radius: 1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .badge-raid { background: rgba(59,130,246,0.2); color: #60a5fa; border: 1px solid rgba(59,130,246,0.3); }
        .badge-encrypt { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid rgba(16,185,129,0.3); }
        .badge-dedup { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.3); }
        .section {
            background-color: rgba(0,0,0,0.2);
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
            text-align: left;
        }
        .section-title {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            background-color: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .message {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 0.5rem;
            display: none;
            font-size: 0.9rem;
            word-break: break-all;
        }
        .message.success {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
            display: block;
        }
        .message.error {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--error);
            border: 1px solid var(--error);
            display: block;
        }
        /* Loading spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* File list table */
        .file-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.85rem;
        }
        .file-table th, .file-table td {
            padding: 0.6rem 0.5rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .file-table th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .file-table td {
            color: var(--text-color);
        }
        .upload-id-cell {
            font-family: monospace;
            color: #60a5fa !important;
            cursor: pointer;
        }
        .upload-id-cell:hover {
            text-decoration: underline;
        }
        .no-files {
            color: var(--text-muted);
            text-align: center;
            padding: 1rem;
            font-style: italic;
        }
        .btn-sm {
            padding: 0.35rem 0.75rem;
            font-size: 0.8rem;
            width: auto;
            display: inline-flex;
        }
        .btn-secondary {
            background-color: var(--border-color);
        }
        .btn-secondary:hover {
            background-color: #475569;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .section-header .section-title {
            margin-bottom: 0;
        }
        .status-dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-online { 
            background-color: var(--success); 
            box-shadow: 0 0 8px var(--success);
            animation: pulse-green 2s infinite; 
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .status-offline { background-color: var(--error); box-shadow: 0 0 8px var(--error); }
        .status-warning { background-color: var(--warning); box-shadow: 0 0 8px var(--warning); }
        .node-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid var(--border-color);
        }
        .node-item:last-child { border-bottom: none; }
        .node-info { display: flex; align-items: center; }
        .node-url { font-family: monospace; color: var(--text-color); font-size: 0.85rem; }
        .node-status-text { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; letter-spacing: 0.05em; }
        .text-online { color: var(--success); }
        .text-offline { color: var(--error); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗄️ Distributed Storage</h1>
        <p class="subtitle">Orchestrator Node</p>
        <div class="badges">
            <span class="badge badge-raid">RAID 5 Parity</span>
            <span class="badge badge-encrypt">AES Encrypted</span>
            <span class="badge badge-dedup">Multi-Copy</span>
        </div>

        <!-- Upload Section -->
        <div class="section">
            <div class="section-title">📤 Upload File</div>
            <form id="uploadForm">
                <input type="file" id="fileInput" name="file" required />
                <button type="submit" id="uploadBtn">
                    <span id="uploadText">Encrypt & Upload</span>
                    <div id="uploadSpinner" class="spinner"></div>
                </button>
            </form>
            <div id="uploadMessage" class="message"></div>
        </div>

        <!-- Download Section -->
        <div class="section">
            <div class="section-title">📥 Download File</div>
            <form id="downloadForm">
                <input type="text" id="fileIdInput" placeholder="Enter Upload ID (e.g. a1b2c3d4)" required />
                <button type="submit" id="downloadBtn">Decrypt & Download</button>
            </form>
            <div id="downloadMessage" class="message"></div>
        </div>

        <!-- Node Status Section -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">🖥️ System Health</div>
                <button class="btn-sm btn-secondary" onclick="loadNodes()">Refresh</button>
            </div>
            <div id="nodeList"><div class="no-files">Checking nodes...</div></div>
        </div>

        <!-- File List Section -->
        <div class="section">
            <div class="section-header">
                <div class="section-title">📋 Uploaded Files</div>
                <button class="btn-sm btn-secondary" onclick="loadFiles()">Refresh</button>
            </div>
            <div id="fileList"><div class="no-files">Loading...</div></div>
        </div>
    </div>

    <script>
        const uploadForm = document.getElementById('uploadForm');
        const uploadBtn = document.getElementById('uploadBtn');
        const uploadText = document.getElementById('uploadText');
        const uploadSpinner = document.getElementById('uploadSpinner');
        const uploadMessage = document.getElementById('uploadMessage');
        const fileInput = document.getElementById('fileInput');

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const file = fileInput.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            // UI Loading state
            uploadBtn.disabled = true;
            uploadText.style.display = 'none';
            uploadSpinner.style.display = 'block';
            uploadMessage.className = 'message';
            uploadMessage.textContent = '';

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (response.ok) {
                    uploadMessage.innerHTML = `✅ Uploaded! <strong>Upload ID: ${result.upload_id}</strong><br>` +
                        `File: ${result.file_name} | Shards: ${result.shards} + ${result.parity} parity | Encrypted: ✔️`;
                    uploadMessage.className = 'message success';
                    fileInput.value = '';
                    loadFiles();
                } else {
                    uploadMessage.textContent = `❌ Error: ${result.error || 'Upload failed'}`;
                    uploadMessage.className = 'message error';
                }
            } catch (error) {
                uploadMessage.textContent = `❌ Error: Network failed or Server Error`;
                uploadMessage.className = 'message error';
            } finally {
                uploadBtn.disabled = false;
                uploadText.style.display = 'block';
                uploadSpinner.style.display = 'none';
            }
        });

        const downloadForm = document.getElementById('downloadForm');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadMessage = document.getElementById('downloadMessage');
        const fileIdInput = document.getElementById('fileIdInput');

        downloadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const uploadId = fileIdInput.value.trim();
            if (!uploadId) return;

            // UI Loading state
            downloadBtn.disabled = true;
            const originalBtnText = downloadBtn.innerHTML;
            downloadBtn.innerHTML = '<span>Processing...</span><div class="spinner" style="display:block; margin-left: 10px;"></div>';
            downloadMessage.className = 'message';
            downloadMessage.textContent = '';

            try {
                const response = await fetch(`/download/${uploadId}`);
                
                if (response.ok) {
                    // It's a file download
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    
                    // Try to get filename from Content-Disposition header
                    const disposition = response.headers.get('Content-Disposition');
                    let fileName = `file_${uploadId}`;
                    if (disposition && disposition.indexOf('attachment') !== -1) {
                        const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                        const matches = filenameRegex.exec(disposition);
                        if (matches != null && matches[1]) { 
                            fileName = matches[1].replace(/['"]/g, '');
                        }
                    }
                    
                    a.download = fileName;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    
                    downloadMessage.textContent = `✅ File "${fileName}" downloaded successfully!`;
                    downloadMessage.className = 'message success';
                } else {
                    // Try to parse error message from JSON
                    const errorResult = await response.json();
                    downloadMessage.textContent = `❌ Error: ${errorResult.error || 'Download failed'}`;
                    downloadMessage.className = 'message error';
                }
            } catch (error) {
                console.error("Download Error:", error);
                downloadMessage.textContent = `❌ Error: Connection failed or decryption error. Check if nodes are online.`;
                downloadMessage.className = 'message error';
            } finally {
                downloadBtn.disabled = false;
                downloadBtn.innerHTML = originalBtnText;
            }
        });

        async function loadFiles() {
            const fileList = document.getElementById('fileList');
            try {
                const res = await fetch('/files');
                const data = await res.json();

                if (data.files.length === 0) {
                    fileList.innerHTML = '<div class="no-files">No files uploaded yet</div>';
                    return;
                }

                let html = `<table class="file-table">
                    <thead><tr>
                        <th>Upload ID</th>
                        <th>File Name</th>
                        <th>Size</th>
                        <th>Time</th>
                    </tr></thead><tbody>`;

                for (const f of data.files) {
                    const sizeKB = (f.size / 1024).toFixed(1);
                    const time = f.upload_time || '—';
                    html += `<tr>
                        <td class="upload-id-cell" onclick="fillDownload('${f.upload_id}')"
                            title="Click to fill download field">${f.upload_id}</td>
                        <td>${f.file_name}</td>
                        <td>${sizeKB} KB</td>
                        <td>${time}</td>
                    </tr>`;
                }

                html += '</tbody></table>';
                fileList.innerHTML = html;
            } catch (e) {
                fileList.innerHTML = '<div class="no-files" style="color: var(--error);">⚠️ Failed to load files.<br><button class="btn-sm btn-secondary" style="margin-top: 10px;" onclick="loadFiles()">Try Again</button></div>';
            }
        }

        async function loadNodes() {
            const nodeList = document.getElementById('nodeList');
            try {
                const res = await fetch('/nodes');
                const data = await res.json();
                
                let html = '';
                data.nodes.forEach(node => {
                    const isOnline = node.status === 'online';
                    const statusClass = isOnline ? 'status-online' : 'status-offline';
                    const textClass = isOnline ? 'text-online' : 'text-offline';
                    const statusText = isOnline ? 'Online' : 'Offline';
                    
                    html += `
                        <div class="node-item">
                            <div class="node-info">
                                <span class="status-dot ${statusClass}"></span>
                                <span class="node-url">${node.url}</span>
                            </div>
                            <span class="node-status-text ${textClass}">${statusText}</span>
                        </div>
                    `;
                });
                nodeList.innerHTML = html;
            } catch (e) {
                nodeList.innerHTML = '<div class="no-files">Failed to load node status</div>';
            }
        }

        function fillDownload(uploadId) {
            document.getElementById('fileIdInput').value = uploadId;
            document.getElementById('fileIdInput').focus();
        }

        // Load data on page load
        loadFiles();
        loadNodes();
        // Periodically refresh node status
        setInterval(loadNodes, 30000);
    </script>
</body>
</html>
